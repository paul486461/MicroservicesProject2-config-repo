server:
  port: 8513

spring:
  application:
    name: service-cart

  datasource:
    url: jdbc:mysql://localhost:3306/db_spzx?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: spzx
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Taipei

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

management:
  health:
    redis:
      enabled: false
